[workspace]
resolver = "2"
members = ["tmpclean-core", "tmpclean-cli", "tmpclean-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/happyaspic-byte/tmpclean"

[workspace.dependencies]
tmpclean-core = { path = "tmpclean-core" }
clap = { version = "4", features = ["derive"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }
embed-manifest = "1.4"

[profile.release]
lto = true
strip = true
panic = "abort"
codegen-units = 1
