[package]
name = "tmpclean-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Fast, safe Windows temp folder cleaner (CLI)"
build = "build.rs"

[[bin]]
name = "tmpclean"
path = "src/main.rs"

[dependencies]
tmpclean-core.workspace = true
clap = { workspace = true, features = ["env"] }

[target.'cfg(windows)'.dependencies]
ctrlc = "3.4"

[dev-dependencies]
serde_json = "1"

[target.'cfg(windows)'.dev-dependencies]
assert_cmd = "2"

[build-dependencies]
embed-manifest.workspace = true
