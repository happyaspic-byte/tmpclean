name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -p tmpclean-core -- -D warnings
      - run: cargo test -p tmpclean-core
      - run: cargo check --target x86_64-pc-windows-msvc --workspace

  windows:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - name: check-release
        shell: pwsh
        run: pwsh -NoProfile -File scripts/check-release.ps1 target/release
      - name: test-check-release
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-check-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: tmpclean-windows-x64
          path: target/release/*.exe
          if-no-files-found: error
